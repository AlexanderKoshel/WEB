services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: restaurant
      MYSQL_USER: restaurant_app
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD before starting MySQL}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - restaurant-data:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./sql/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro

volumes:
  restaurant-data:
